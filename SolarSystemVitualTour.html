<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta charset="utf-8">
  <title>Solar System</title>
  <style>
    body {
      background-color: black;
      overflow: auto; /* Allow scrolling */
      height: 200vh; /* Set a larger height for scrolling */
      margin: 0; /* Remove default margin */
    }

    li, a, button {
      font-family: 'Courier New', Courier, monospace;
      font-weight: 500;
      font-size: 16px;
      color: #ecf0f1;
      text-decoration: none;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 30px 10%;
      position: fixed; /* Keep header fixed at the top */
      width: 100%; /* Full width */
      z-index: 1000; /* Ensure it stays above other content */
    }

    .logo {
      cursor: pointer;
    }

    .nav-links {
      list-style: none;
    }

    .nav-links li {
      display: inline-block;
      padding: 0px 20px;
    }

    .nav-links li a {
      transition: all 0.3s ease 0s;
    }

    .nav-links li a:hover {
      color: blue;
    }

    button {
      padding: 9px 25px;
      background-color: rgba(0, 136, 169, 1);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease 0s;
    }

    button:hover {
      background-color: rgba(0, 136, 169, 0.8);
    }

    .object {
      position: absolute;
      transition: left 0.1s, top 0.1s;
    }

    #moon {
      width: 10px; /* Adjust size as needed */
      height: 10px; /* Adjust size as needed */
      background-color: gray; /* Placeholder color */
      border-radius: 50%;
    }
  </style>
</head>

<body>
  <header>
    <img src="assets/Logo.png" alt="Logo" class="logo" width="100px" height="50px">
    <nav>
      <ul class="nav-links">
        <li><a href="#">Services</a></li>
        <li><a href="#">Projects</a></li>
        <li><a href="#">About</a></li>
      </ul>
    </nav>
    <a href="#" class="cta"><button>Contacts</button></a>
  </header>

  <img class="object" src="sun.png" alt="Sun" id="sun">
  <img class="object planet" src="mercury.png" alt="Mercury" id="mercury">
  <img class="object planet" src="venus.png" alt="Venus" id="venus">
  <img class="object planet" src="earth.png" alt="Earth" id="earth">
  <img class="object planet" src="mars.png" alt="Mars" id="mars">
  <img class="object planet" src="jupiter.png" alt="Jupiter" id="jupiter">
  <img class="object planet" src="saturn.png" alt="Saturn" id="saturn">
  <img class="object planet" src="uranus.png" alt="Uranus" id="uranus">
  <img class="object planet" src="neptune.png" alt="Neptune" id="neptune">
  <img src="asteroid.png" class="object" alt="Asteroid Belt" id="belt">
  <div class="object" id="moon"></div>

  <div class="object p-orbit "></div>
  <div class="object p-orbit"></div>
  <div class="object p-orbit"></div>
  <div class="object p-orbit"></div>
  <div class="object p-orbit"></div>
  <div class="object p-orbit"></div>
  <div class="object p-orbit"></div>
  <div class="object p-orbit"></div>
  <div class="object" id="m-orbit"></div>

</body>
<script src="script.js"></script>
