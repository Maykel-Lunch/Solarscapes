<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Solar System Model</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Orbitron&family=Roboto+Mono&family=Share+Tech+Mono&family=Audiowide&family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="../../assets/css/site.css">
  <link rel="stylesheet" href="../../assets/css/solar-system.css">
</head>

<body>

  <!-- Navigation Bar Placeholder -->
  <div id="navbar-placeholder"></div>

  <!-- 3D Solar System -->
  <div id="scene-container">
    <div id="loading-overlay">
      <div class="spinner-ring"></div>
      <div>Warming up the solar system…</div>
    </div>

    <div id="hint-banner" class="glass-panel">
      🖱️ Drag to orbit &nbsp;•&nbsp; Scroll to zoom &nbsp;•&nbsp; Tap a planet to explore
    </div>

    <div id="control-panel" class="glass-panel">
      <div class="row-line">
        <button id="playPauseBtn" title="Pause / Play"><i class="fa fa-pause"></i></button>
        <button id="soundBtn" title="Toggle ambient sound"><i class="fa fa-volume-mute"></i></button>
        <button id="resetViewBtn" title="Reset camera view"><i class="fa fa-crosshairs"></i></button>
      </div>
      <div class="row-line">
        <span>🐢</span>
        <input type="range" id="speedRange" min="0" max="4" step="0.1" value="1">
        <span>🐇</span>
        <span id="speedLabel">1.0x</span>
      </div>
    </div>

    <div id="planet-chips"></div>

    <div id="info-card" class="glass-panel">
      <button class="close-btn" id="closeInfoBtn"><i class="fa fa-times"></i></button>
      <h5 id="infoName">—</h5>
      <div class="fact" id="infoFact">—</div>
      <div class="stat-row"><span>Distance from Sun</span><span id="infoDistance">—</span></div>
      <div class="stat-row"><span>Orbital period</span><span id="infoPeriod">—</span></div>
      <div class="stat-row"><span>Day length</span><span id="infoDay">—</span></div>
    </div>

    <div id="hover-tip"></div>
  </div>

  <!-- Footer Section -->
  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    function initDropdowns(root) {
      const toggles = root.querySelectorAll('.nav-item.dropdown > .dropdown-toggle');

      function closeAll(except) {
        root.querySelectorAll('.dropdown-menu.show').forEach(function (menu) {
          if (menu === except) return;
          menu.classList.remove('show');
          const t = menu.previousElementSibling;
          if (t) t.setAttribute('aria-expanded', 'false');
        });
      }

      toggles.forEach(function (toggle) {
        const menu = toggle.nextElementSibling;
        if (!menu || !menu.classList.contains('dropdown-menu')) return;

        menu.style.position = 'fixed';
        menu.style.margin = '0';
        menu.style.zIndex = '99999';

        function positionMenu() {
          const rect = toggle.getBoundingClientRect();
          menu.style.top = rect.bottom + 'px';
          menu.style.left = rect.left + 'px';
        }

        toggle.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          const isOpen = menu.classList.contains('show');
          closeAll(isOpen ? null : menu);
          if (!isOpen) positionMenu();
          menu.classList.toggle('show', !isOpen);
          toggle.setAttribute('aria-expanded', String(!isOpen));
        });

        window.addEventListener('resize', function () {
          if (menu.classList.contains('show')) positionMenu();
        });
        window.addEventListener('scroll', function () {
          if (menu.classList.contains('show')) positionMenu();
        }, true);
      });

      document.addEventListener('click', function (e) {
        if (!root.contains(e.target)) closeAll();
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeAll();
      });
    }

    $(document).ready(function () {
      // Load Header
      const placeholder = document.getElementById('navbar-placeholder');
      $("#navbar-placeholder").load("../../includes/header.html", function (response, status, xhr) {
        if (status == "error") {
          console.log("Error loading header: " + xhr.status + " " + xhr.statusText);
          $("#navbar-placeholder").html('<div class="alert alert-danger m-3">Failed to load navigation. Please refresh the page.</div>');
          return;
        }
        initDropdowns(placeholder);
      });

      // Load Footer
      $("#footer-placeholder").load("../../includes/footer.html", function (response, status, xhr) {
        if (status == "error") {
          console.log("Error loading footer: " + xhr.status + " " + xhr.statusText);
          $("#footer-placeholder").html('<div class="alert alert-danger m-3">Failed to load footer. Please refresh the page.</div>');
        }
      });
    });
  </script>

  <!-- Three.js + OrbitControls -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="../../assets/js/solar-system.js"></script>
  <script src="../../assets/js/site.js"></script>

  <script>
    (function () {
      const container = document.getElementById('scene-container');
      const loadingOverlay = document.getElementById('loading-overlay');
      const hintBanner = document.getElementById('hint-banner');
      const hoverTip = document.getElementById('hover-tip');
      const infoCard = document.getElementById('info-card');
      const chipsWrap = document.getElementById('planet-chips');

      /* ---------------- PLANET DATA ---------------- */
      const PLANETS = [
        {
          key: 'sun', name: 'The Sun', color: '#ffd966', radius: 26, distance: 0, speed: 0,
          rotationSpeed: 0.04, fact: "Our Sun holds 99.8% of the Solar System's mass. It's basically the boss of everyone here.",
          distanceLabel: '—', periodLabel: '—', dayLabel: '~27 days (rotation)'
        },
        {
          key: 'mercury', name: 'Mercury', color: '#b0b0b0', radius: 3, distance: 55, speed: 1.9,
          rotationSpeed: 0.01, fact: 'Mercury has no atmosphere to speak of, so it swings from scorching days to freezing nights.',
          distanceLabel: '0.39 AU', periodLabel: '88 days', dayLabel: '59 days'
        },
        {
          key: 'venus', name: 'Venus', color: '#e0a96d', radius: 5, distance: 78, speed: 1.5,
          rotationSpeed: -0.006, fact: 'Venus spins backwards and is hotter than Mercury thanks to a runaway greenhouse effect.',
          distanceLabel: '0.72 AU', periodLabel: '225 days', dayLabel: '243 days'
        },
        {
          key: 'earth', name: 'Earth', color: '#4ab3ff', radius: 5.2, distance: 104, speed: 1,
          rotationSpeed: 0.03, tilt: 0.41, fact: 'Home sweet home — the only planet we know of that has liquid water and life.',
          distanceLabel: '1 AU', periodLabel: '365 days', dayLabel: '24 hours'
        },
        {
          key: 'mars', name: 'Mars', color: '#c1440e', radius: 4, distance: 130, speed: 0.8,
          rotationSpeed: 0.028, fact: 'The Red Planet gets its color from iron oxide — plain old rust — coating its surface.',
          distanceLabel: '1.52 AU', periodLabel: '687 days', dayLabel: '24.6 hours'
        },
        {
          key: 'jupiter', name: 'Jupiter', color: '#c8926a', radius: 15, distance: 190, speed: 0.43,
          rotationSpeed: 0.06, fact: "Jupiter is so massive that every other planet combined could fit inside it, with room to spare.",
          distanceLabel: '5.2 AU', periodLabel: '12 years', dayLabel: '10 hours'
        },
        {
          key: 'saturn', name: 'Saturn', color: '#e0c16c', radius: 13, distance: 240, speed: 0.32,
          rotationSpeed: 0.055, tilt: 0.47, hasRing: true,
          fact: "Saturn's rings are made of ice and rock — pieces range from grains of sand to house-sized chunks.",
          distanceLabel: '9.5 AU', periodLabel: '29 years', dayLabel: '10.7 hours'
        },
        {
          key: 'uranus', name: 'Uranus', color: '#9fdde0', radius: 9, distance: 285, speed: 0.23,
          rotationSpeed: 0.035, tilt: 1.4, fact: 'Uranus rotates almost completely on its side, likely the result of an ancient collision.',
          distanceLabel: '19.8 AU', periodLabel: '84 years', dayLabel: '17 hours'
        },
        {
          key: 'neptune', name: 'Neptune', color: '#4066cc', radius: 8.6, distance: 325, speed: 0.18,
          rotationSpeed: 0.033, fact: 'Neptune has the fastest winds in the Solar System, gusting over 2,000 km/h.',
          distanceLabel: '30.1 AU', periodLabel: '165 years', dayLabel: '16 hours'
        },
        {
          key: 'pluto', name: 'Pluto', color: '#d8d0c8', radius: 2.2, distance: 360, speed: 0.14,
          rotationSpeed: 0.008, fact: 'Reclassified as a dwarf planet in 2006 — still much loved by fans of the underdog.',
          distanceLabel: '39.5 AU', periodLabel: '248 years', dayLabel: '6.4 days'
        }
      ];

      /* ---------------- SCENE SETUP ---------------- */
      let scene, camera, renderer, controls, raycaster, mouse;
      let sunMesh, sunLight;
      const planetGroups = {};   // key -> { orbitAngle, mesh, group, data }
      const clickableMeshes = [];
      let clock = new THREE.Clock();
      let timeScale = 1;
      let isPlaying = true;
      let focusedKey = null;
      let cameraTarget = new THREE.Vector3(0, 0, 0);
      let desiredCamPos = null;
      let audioCtx = null;
      let ambientNodes = null;
      let soundOn = false;

      function init() {
        scene = new THREE.Scene();

        camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 4000);
        camera.position.set(0, 160, 420);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.insertBefore(renderer.domElement, container.firstChild);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 40;
        controls.maxDistance = 900;

        raycaster = new THREE.Raycaster();
        mouse = new THREE.Vector2(-10, -10);

        scene.add(new THREE.AmbientLight(0x445577, 0.35));

        buildStarfield();
        buildSun();
        PLANETS.filter(p => p.key !== 'sun').forEach(buildPlanet);
        buildAsteroidBelt();
        buildChips();

        window.addEventListener('resize', onResize);
        renderer.domElement.addEventListener('pointerdown', onPointerDown);
        renderer.domElement.addEventListener('pointermove', onPointerMove);
        renderer.domElement.addEventListener('pointerdown', () => container.classList.add('grabbing'));
        window.addEventListener('pointerup', () => container.classList.remove('grabbing'));

        document.getElementById('playPauseBtn').addEventListener('click', togglePlay);
        document.getElementById('soundBtn').addEventListener('click', toggleSound);
        document.getElementById('resetViewBtn').addEventListener('click', resetView);
        document.getElementById('closeInfoBtn').addEventListener('click', deselectPlanet);
        document.getElementById('speedRange').addEventListener('input', (e) => {
          timeScale = parseFloat(e.target.value);
          document.getElementById('speedLabel').textContent = timeScale.toFixed(1) + 'x';
        });

        loadingOverlay.style.display = 'none';
        setTimeout(() => hintBanner.classList.add('hidden'), 5000);

        animate();
      }

      function buildStarfield() {
        const starCount = 2200;
        const positions = new Float32Array(starCount * 3);
        const colors = new Float32Array(starCount * 3);
        const palette = [[1, 1, 1], [0.75, 0.85, 1], [1, 0.92, 0.75]];
        for (let i = 0; i < starCount; i++) {
          const radius = 900 + Math.random() * 900;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos((Math.random() * 2) - 1);
          positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
          positions[i * 3 + 1] = radius * Math.cos(phi);
          positions[i * 3 + 2] = radius * Math.sin(phi) * Math.sin(theta);
          const c = palette[Math.floor(Math.random() * palette.length)];
          colors[i * 3] = c[0]; colors[i * 3 + 1] = c[1]; colors[i * 3 + 2] = c[2];
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        const mat = new THREE.PointsMaterial({ size: 1.6, vertexColors: true, transparent: true, opacity: 0.85, depthWrite: false });
        scene.add(new THREE.Points(geo, mat));
      }

      function glowSprite(hexColor, size) {
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = 256;
        const ctx = canvas.getContext('2d');
        const gradient = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
        gradient.addColorStop(0, hexColor + 'ff');
        gradient.addColorStop(0.4, hexColor + '55');
        gradient.addColorStop(1, hexColor + '00');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 256, 256);
        const texture = new THREE.CanvasTexture(canvas);
        const mat = new THREE.SpriteMaterial({ map: texture, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
        const sprite = new THREE.Sprite(mat);
        sprite.scale.set(size, size, 1);
        return sprite;
      }

      function buildSun() {
        const data = PLANETS[0];
        const geo = new THREE.SphereGeometry(data.radius, 48, 48);
        const mat = new THREE.MeshBasicMaterial({ color: data.color });
        sunMesh = new THREE.Mesh(geo, mat);
        sunMesh.userData.key = 'sun';
        scene.add(sunMesh);
        clickableMeshes.push(sunMesh);
        sunMesh.add(glowSprite('#ffdd88', data.radius * 6));

        sunLight = new THREE.PointLight(0xfff2cc, 1.6, 2200, 1.4);
        scene.add(sunLight);

        planetGroups.sun = { orbitAngle: 0, mesh: sunMesh, group: sunMesh, data };
      }

      function buildPlanet(data) {
        const group = new THREE.Group();
        group.rotation.y = Math.random() * Math.PI * 2;
        scene.add(group);

        // orbit path line
        const curvePts = [];
        for (let i = 0; i <= 128; i++) {
          const a = (i / 128) * Math.PI * 2;
          curvePts.push(new THREE.Vector3(Math.cos(a) * data.distance, 0, Math.sin(a) * data.distance));
        }
        const orbitGeo = new THREE.BufferGeometry().setFromPoints(curvePts);
        const orbitMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.18 });
        scene.add(new THREE.LineLoop(orbitGeo, orbitMat));

        const planetPivot = new THREE.Object3D();
        planetPivot.position.set(data.distance, 0, 0);
        group.add(planetPivot);

        const mesh = new THREE.Mesh(
          new THREE.SphereGeometry(data.radius, 32, 32),
          new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.85, metalness: 0.05 })
        );
        mesh.userData.key = data.key;
        if (data.tilt) mesh.rotation.z = data.tilt;
        planetPivot.add(mesh);
        clickableMeshes.push(mesh);

        if (data.key === 'earth') {
          mesh.add(glowSprite('#7ec8ff', data.radius * 2.6));
        }

        if (data.hasRing) {
          const ringGeo = new THREE.RingGeometry(data.radius * 1.4, data.radius * 2.4, 64);
          const pos = ringGeo.attributes.position;
          const uv = ringGeo.attributes.uv;
          for (let i = 0; i < pos.count; i++) {
            const x = pos.getX(i), y = pos.getY(i);
            const r = Math.sqrt(x * x + y * y);
            uv.setXY(i, (r - data.radius * 1.4) / (data.radius * 1.0), 0);
          }
          const ringMat = new THREE.MeshBasicMaterial({ color: data.color, side: THREE.DoubleSide, transparent: true, opacity: 0.55 });
          const ring = new THREE.Mesh(ringGeo, ringMat);
          ring.rotation.x = Math.PI / 2 + 0.35;
          mesh.add(ring);
        }

        planetGroups[data.key] = { orbitAngle: Math.random() * Math.PI * 2, mesh, group, planetPivot, data };
      }

      function buildAsteroidBelt() {
        const beltGeo = new THREE.IcosahedronGeometry(1, 0);
        const beltMat = new THREE.MeshStandardMaterial({ color: 0x998877, roughness: 1 });
        const count = 420;
        const inst = new THREE.InstancedMesh(beltGeo, beltMat, count);
        const dummy = new THREE.Object3D();
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const dist = 152 + Math.random() * 24;
          const y = (Math.random() - 0.5) * 6;
          dummy.position.set(Math.cos(angle) * dist, y, Math.sin(angle) * dist);
          const s = 0.5 + Math.random() * 1.1;
          dummy.scale.set(s, s, s);
          dummy.rotation.set(Math.random() * 6, Math.random() * 6, Math.random() * 6);
          dummy.updateMatrix();
          inst.setMatrixAt(i, dummy.matrix);
        }
        scene.add(inst);
      }

      function buildChips() {
        PLANETS.forEach(p => {
          const chip = document.createElement('div');
          chip.className = 'chip glass-panel';
          chip.dataset.key = p.key;
          chip.innerHTML = `<span class="dot" style="background:${p.color}"></span>${p.name}`;
          chip.addEventListener('click', () => selectPlanet(p.key));
          chipsWrap.appendChild(chip);
        });
      }

      /* ---------------- INTERACTION ---------------- */
      function onResize() {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
      }

      function getMeshWorldPos(key) {
        const p = planetGroups[key];
        const v = new THREE.Vector3();
        p.mesh.getWorldPosition(v);
        return v;
      }

      function onPointerMove(e) {
        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const hits = raycaster.intersectObjects(clickableMeshes, false);
        if (hits.length > 0) {
          const key = hits[0].object.userData.key;
          const data = planetGroups[key].data;
          hoverTip.style.display = 'block';
          hoverTip.style.left = (e.clientX - rect.left) + 'px';
          hoverTip.style.top = (e.clientY - rect.top) + 'px';
          hoverTip.textContent = data.name;
          container.style.cursor = 'pointer';
        } else {
          hoverTip.style.display = 'none';
          container.style.cursor = 'grab';
        }
      }

      function onPointerDown(e) {
        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const hits = raycaster.intersectObjects(clickableMeshes, false);
        if (hits.length > 0) {
          selectPlanet(hits[0].object.userData.key);
        }
      }

      function selectPlanet(key) {
        focusedKey = key;
        const data = planetGroups[key].data;

        document.getElementById('infoName').textContent = data.name;
        document.getElementById('infoFact').textContent = data.fact;
        document.getElementById('infoDistance').textContent = data.distanceLabel;
        document.getElementById('infoPeriod').textContent = data.periodLabel;
        document.getElementById('infoDay').textContent = data.dayLabel;
        infoCard.classList.add('show');

        document.querySelectorAll('.chip').forEach(c => c.classList.toggle('selected', c.dataset.key === key));

        playChime();
      }

      function deselectPlanet() {
        focusedKey = null;
        infoCard.classList.remove('show');
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
      }

      function resetView() {
        deselectPlanet();
        desiredCamPos = new THREE.Vector3(0, 160, 420);
        cameraTarget = new THREE.Vector3(0, 0, 0);
      }

      function togglePlay() {
        isPlaying = !isPlaying;
        const btn = document.getElementById('playPauseBtn');
        btn.innerHTML = isPlaying ? '<i class="fa fa-pause"></i>' : '<i class="fa fa-play"></i>';
      }

      /* ---------------- AMBIENT SOUND (opt-in) ---------------- */
      function ensureAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      function toggleSound() {
        ensureAudio();
        soundOn = !soundOn;
        const btn = document.getElementById('soundBtn');
        btn.classList.toggle('active', soundOn);
        btn.innerHTML = soundOn ? '<i class="fa fa-volume-up"></i>' : '<i class="fa fa-volume-mute"></i>';

        if (soundOn) {
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const masterGain = audioCtx.createGain();
          masterGain.gain.value = 0;
          masterGain.connect(audioCtx.destination);
          masterGain.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 1.5);

          const osc1 = audioCtx.createOscillator();
          osc1.type = 'sine'; osc1.frequency.value = 82;
          const osc2 = audioCtx.createOscillator();
          osc2.type = 'sine'; osc2.frequency.value = 110.5;
          const filter = audioCtx.createBiquadFilter();
          filter.type = 'lowpass'; filter.frequency.value = 500;

          osc1.connect(filter); osc2.connect(filter); filter.connect(masterGain);
          osc1.start(); osc2.start();
          ambientNodes = { osc1, osc2, masterGain };
        } else if (ambientNodes) {
          ambientNodes.masterGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.8);
          setTimeout(() => {
            if (ambientNodes) {
              ambientNodes.osc1.stop(); ambientNodes.osc2.stop();
              ambientNodes = null;
            }
          }, 900);
        }
      }

      function playChime() {
        if (!soundOn || !audioCtx) return;
        const now = audioCtx.currentTime;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.08, now + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.1);
        gain.connect(audioCtx.destination);

        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(660, now);
        osc.frequency.exponentialRampToValueAtTime(990, now + 0.3);
        osc.connect(gain);
        osc.start(now);
        osc.stop(now + 1.2);
      }

      /* ---------------- ANIMATE ---------------- */
      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);

        if (isPlaying) {
          Object.values(planetGroups).forEach(p => {
            if (p.data.key === 'sun') {
              p.mesh.rotation.y += p.data.rotationSpeed * dt * 4;
              return;
            }
            p.orbitAngle += p.data.speed * dt * 0.25 * timeScale;
            p.group.rotation.y = p.orbitAngle;
            p.mesh.rotation.y += p.data.rotationSpeed * dt * 6;
          });
        }

        if (focusedKey) {
          const worldPos = getMeshWorldPos(focusedKey);
          controls.target.lerp(worldPos, 0.08);
          const data = planetGroups[focusedKey].data;
          const offset = new THREE.Vector3(data.radius * 5 + 22, data.radius * 2.4 + 12, data.radius * 5 + 22);
          const desired = worldPos.clone().add(offset);
          camera.position.lerp(desired, 0.04);
        } else if (desiredCamPos) {
          controls.target.lerp(cameraTarget, 0.08);
          camera.position.lerp(desiredCamPos, 0.05);
          if (camera.position.distanceTo(desiredCamPos) < 1) desiredCamPos = null;
        }

        controls.update();
        renderer.render(scene, camera);
      }

      // Wait for THREE + OrbitControls to be ready, then boot.
      if (window.THREE && THREE.OrbitControls) {
        init();
      } else {
        window.addEventListener('load', init);
      }
    })();
  </script>

</body>

</html>
