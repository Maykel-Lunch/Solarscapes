<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage: Solarscapes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <style>
        body {
            background-image: url("assets/bg.png");
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
    </style>
</head>

<body>
    
    <div id="EnterName">
        <div class="d-flex justify-content-center mt-5">

            <div class="card text-center bg-transparent" style="width: 600px;  background:transparent;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border: 2px solid rgba(255, 255,255, 0.2);
            backdrop-filter: blur(20px);
            ">
    
                <div class="d-flex justify-content-center mt-2 p-2">
                    <img class="img-thumbnail" alt="100%x280" src="assets/image-removebg-preview (1).png"
                        style="border-radius: 50%; height:280px; width:280px;background-color: #f5fffa;">
                </div>
    
                <div class="card-body">
                    
                    
                    <form>
                        <div class="form-floating mb-3 mt-2">
                          <input type="text" class="form-control" id="name" placeholder="Enter your name" name="name">
                          <label for="name">Enter your name</label>
                        </div>

                        <button class="btn btn-primary" id="nameButton">Submit</button>
                      </form>
                </div>
    
            </div>
        </div>
    </div>
    

    <div id="Welcome" style="display: none;">
        <div class="d-flex justify-content-center mt-5">

            <div class="card text-center" style="width: 600px; background:transparent;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border: 2px solid rgba(255, 255,255, 0.2);
            backdrop-filter: blur(20px); color: #f5fffa;">
    
                <div class="d-flex justify-content-center mt-2 p-2">
                    <img class="img-thumbnail" alt="100%x280" src="assets/image-removebg-preview (1).png"
                        style="border-radius: 50%; height:260px; width:260px;background-color: #f5fffa;">
                </div>
    
                <div class="card-body">
                    <h5 class="card-title">Hey <span id="displayName"></span>&#128075;</h5>
                    <h3 class="card-title">Welcome to Our Website</h3>
                    <p class="card-text m-0">Let's start with a quick tour and we will have you </p>
                    <p class="card-text mt-0">demystified the secrets of our solar system.</p>
                    <a href="ContentPage.html" class="btn btn-primary">Get Started</a>
                </div>
    
            </div>
        </div>
    </div>
    

</body>

</html>

<script>
    $(document).ready(function () {
        $("#nameButton").click(function (event) {
            event.preventDefault();
            var username = $("#name").val();
            $("#displayName").text(" " + username);
            $("#EnterName").hide();
            $("#Welcome").show();
        });
    });
</script>
